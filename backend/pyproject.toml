[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g3-omnivoice-server"
version = "0.2.0"
description = "Windows-first OmniVoice TTS server with queue, auth, stats, and benchmarks."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "huggingface-hub>=0.30",
  "imageio-ffmpeg>=0.5,<1.0",
  "kernels>=0.14.1,<0.15",
  "tomlkit>=0.13.3,<0.15",
  # Upstream master 08be0b4 (2026-08-24): 0.2.1 inference core + opt-in FlashInfer path.
  # Reports version 0.2.1; see requirements-lock.txt for why it is pinned by URL.
  "omnivoice @ https://github.com/k2-fsa/OmniVoice/archive/08be0b4ccbac3e13e374e86fbfead4b4cac343e2.zip"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"omnivoice_tts_server.voice_presets" = ["*.json", "*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
