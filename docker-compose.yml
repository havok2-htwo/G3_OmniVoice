# G3_OmniVoice — TTS / voice-cloning service (:8091) as one GPU container (standalone).
#
#   docker compose up -d --build                          # .env is optional
#   ENABLE_FLASHINFER=false docker compose up -d --build  # image without FlashInfer (or put it into .env)
#
# This is the STANDALONE alternative to the g3-voice stack in the g3_whisper repo, which builds this repo from a
# sibling checkout as its `omnivoice` service. Run one or the other, never both: they use the same host port (8091)
# and the same container name (g3-omnivoice). Volumes are not shared between the two (different project names).
#
# Host needs: Docker Engine + Compose v2 (>= 2.24.0) and the NVIDIA Container Toolkit. The GPU can be shared with
# the other G3 services (Whisper :7861, EMBED :8777, RERANK :8778); keep the VRAM budget in the admin UI
# conservative there. The first start is slow: k2-fsa/OmniVoice (~3 GB) is downloaded into the models volume and
# warmed up (hence the long healthcheck start_period). Ming / Audio8 / Phonon weights are never in the image; download
# them from the admin UI or copy them into the models volume. Admin UI login is username/password (default
# admin/admin, forced change on first login); client API keys are optional and created in the admin UI.
#
# WER benchmarks transcribe through a Whisper server. Inside this container the code default (127.0.0.1:7861) is the
# container itself, so the default here points at a Whisper on the Docker host; set OMNIVOICE_TTS_WHISPER_BASE_URL in
# .env to use another one (e.g. http://192.168.1.10:7861). Other OMNIVOICE_TTS_* settings go into .env as well.
# Note: the first save in the admin Settings (any field) or an engine switch writes all runtime settings, this URL
# included, into data/runtime_settings.json, and from then on the saved value wins over .env. Change the URL in the
# admin Settings after that, or delete its key from the file.

name: g3-omnivoice

services:
  omnivoice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_FLASHINFER: ${ENABLE_FLASHINFER:-true}
    image: g3-omnivoice:latest
    container_name: g3-omnivoice
    restart: unless-stopped
    ports:
      - "8091:8091"
    env_file:
      - path: .env
        required: false
    environment:
      OMNIVOICE_TTS_WHISPER_BASE_URL: ${OMNIVOICE_TTS_WHISPER_BASE_URL:-http://host.docker.internal:7861}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - omnivoice_models:/app/models
      - omnivoice_data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/openapi.json"]
      interval: 30s
      timeout: 5s
      start_period: 1800s
      retries: 5

volumes:
  omnivoice_models:
  omnivoice_data:
